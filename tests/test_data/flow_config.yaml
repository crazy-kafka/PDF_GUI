flow_name: "Chip Design Flow"

step_groups:
  - name: APR
    label: "APR"
    steps:
      - name: init
        logs:
          - "logs/{version}/{step}/run.log"
      - name: floorplan
        logs:
          - "logs/{version}/{step}/run.log"
      - name: place
        logs:
          - "logs/{version}/{step}/run.log"
        databases:
          - label: "ICC2 Layout"
            command: "python tests/test_data/db_launcher.py --no-gui --label {label} --version {version} --step {step}"
          - label: "Verdi Debug"
            command: "python tests/test_data/db_launcher.py --no-gui --label {label} --version {version} --step {step}"
      - name: cts
      - name: route
        databases:
          - label: "Route DB"
            # uses global database_command fallback
      - name: routeopt
        databases:
          - label: "RouteOpt DB"
            command: "python tests/test_data/db_launcher.py --no-gui --label {label} --version {version} --step {step}"
    metrics:
      - key: REG2REG@wns
        label: "wns"
        format: ".3f"
        reports:
          - "reports/{version}/{step}/reg2reg_timing.rpt"
        step_reports:
          place:
            - "reports/{version}/place/place_opt0.rpt"
            - "reports/{version}/place/place_opt1.rpt"
      - key: REG2REG@tns
        label: "tns"
        format: ".3f"
      - key: REG2REG@nvp
        label: "nvp"
        format: ".0f"
      - key: IO@wns
        label: "wns"
        format: ".3f"
        reports:
          - "reports/{version}/{step}/io_timing.rpt"
      - key: IO@tns
        label: "tns"
        format: ".3f"
      - key: IO@nvp
        label: "nvp"
        format: ".0f"
      - key: density
        label: "Density"
        format: ".2f"
        pictures:
          - "img/{version}/{step}/density.png"
        step_pictures:
          place:
            - "img/{version}/place/density_place.png"
      - key: power
        label: "Power (mW)"
        format: ".2f"
      - key: ulvt_ratio
        label: "ULVT Ratio"
        format: ".2f"
      - key: wire_length
        label: "Wire Length"
        format: ".1f"
      - key: congestion
        label: "Congestion"
        format: ".2f"
  - name: STA
    label: "STA"
    steps:
      - name: setup_scen_0
        logs:
          - "logs/{version}/{step}/run.log"
      - name: setup_scen_1
        logs:
          - "logs/{version}/{step}/run.log"
      - name: hold_scen_0
      - name: ptpx_scen_0
    metrics:
      - key: WNS
        label: "WNS"
        format: ".3f"
        reports:
          - "reports/{version}/{step}/timing.rpt"
      - key: TNS
        label: "TNS"
        format: ".3f"
      - key: max_transition
        label: "Max Transition"
        format: ".4f"
      - key: max_capacitance
        label: "Max Capacitance"
        format: ".4f"
      - key: min_pulse_width
        label: "Min Pulse Width"
        format: ".4f"
  - name: PV
    label: "PV"
    steps:
      - drc
      - ant
      - lvs
      - erc
    metrics:
      - key: DRC
        label: "DRC"
      - key: LVS
        label: "LVS"
      - key: ANT
        label: "ANT"
      - key: ERC
        label: "ERC"

steps:

metrics:

job_columns:
  - key: status
    label: "Job Status"
  - key: runtime
    label: "Wall Time"

database_command: "python tests/test_data/db_launcher.py --no-gui --label {label} --version {version} --step {step}"
