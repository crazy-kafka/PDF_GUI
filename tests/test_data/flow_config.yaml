flow_name: "Chip Design Flow"

steps:
  - name: init
    label: "Initialize"
    logs:
      - "logs/{version}/{step}/run.log"
  - name: floorplan
    label: "Floorplan"
    logs:
      - "logs/{version}/{step}/run.log"
  - name: place
    label: "Placement"
    logs:
      - "logs/{version}/{step}/run.log"
  - name: cts
    label: "Clock Tree"
    logs:
      - "logs/{version}/{step}/run.log"
  - name: route
    label: "Routing"
    logs:
      - "logs/{version}/{step}/run.log"
  - name: routeopt
    label: "Route Opt"
    logs:
      - "logs/{version}/{step}/run.log"
  - name: STA
    label: "Static Timing"
    logs:
      - "logs/{version}/{step}/run.log"

metrics:
  - key: WNS
    label: "WNS"
    format: ".3f"
    reports:
      - "reports/{version}/{step}/timing.rpt"
      - "reports/{version}/{step}/wns_summary.rpt"
  - key: TNS
    label: "TNS"
    format: ".3f"
  - key: max_cap
    label: "Max Cap"
    format: ".4f"
  - key: max_tran
    label: "Max Tran"
    format: ".4f"
  - key: leakage
    label: "Leakage (mW)"
    format: ".2f"
  - key: density
    label: "Density"
    format: ".2f"
    reports:
      - "rpt/{version}/{step}/density.rpt"
    pictures:
      - "img/{version}/{step}/density.png"

job_columns:
  - key: status
    label: "Job Status"
  - key: runtime
    label: "Wall Time"
