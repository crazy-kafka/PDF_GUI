# =====================================================================
# PDF_GUI Configuration File
# =====================================================================
# Flow developers: define step groups, steps, metrics, and reports here.
# Each group appears as a tab in the GUI with its own steps and metrics.
# See docs/flow_config_schema.md for full documentation.
# =====================================================================

flow_name: "Chip Design Flow"

step_groups:
  - name: APR
    label: "APR"
    steps:
      - name: init
        label: "Initialize"
        logs:
          - "logs/{version}/{step}/run.log"
      - name: floorplan
        label: "Floorplan"
        logs:
          - "logs/{version}/{step}/run.log"
      - name: place
        label: "Placement"
        logs:
          - "logs/{version}/{step}/run.log"
      - name: cts
        label: "Clock Tree"
        logs:
          - "logs/{version}/{step}/run.log"
      - name: route
        label: "Routing"
        logs:
          - "logs/{version}/{step}/run.log"
      - name: routeopt
        label: "Route Opt"
        logs:
          - "logs/{version}/{step}/run.log"
    metrics:
      - key: WNS
        label: "WNS"
        format: ".3f"
        reports:
          - "reports/{version}/{step}/timing.rpt"
          - "reports/{version}/{step}/wns_summary.rpt"
      - key: TNS
        label: "TNS"
        format: ".3f"
      - key: max_cap
        label: "Max Cap"
        format: ".4f"
      - key: max_tran
        label: "Max Tran"
        format: ".4f"
      - key: leakage
        label: "Leakage (mW)"
        format: ".2f"
      - key: density
        label: "Density"
        format: ".2f"
        reports:
          - "rpt/{version}/{step}/density.rpt"
        pictures:
          - "img/{version}/{step}/density.png"
          - "img/{version}/{step}/density_hist.png"
  - name: STA
    label: "STA"
    steps:
      - name: STA
        label: "Static Timing"
        logs:
          - "logs/{version}/{step}/run.log"
    metrics:
      - key: WNS
        label: "WNS"
        format: ".3f"
        reports:
          - "reports/{version}/{step}/timing.rpt"
      - key: TNS
        label: "TNS"
        format: ".3f"

job_columns:
  - key: status
    label: "Job Status"
  - key: runtime
    label: "Wall Time"

colors:
  SUCCESS: "#4CAF50"
  FAIL: "#F44336"
  RUNNING: "#2196F3"
  PENDING: "#FF9800"

icons:
  SUCCESS: "✓"
  FAIL: "✗"
  RUNNING: "⟳"
  PENDING: "○"

default_font: "Consolas"
default_font_size: 10
auto_refresh_seconds: 0

# Optional: script to run before each refresh (e.g., pull data from flow system)
# refresh_command: "./pull_data.sh"

# Optional: custom command to open text files (reports, logs). {file} = resolved path.
# If unset, the OS default handler is used.
# report_command: "gvim {file}"

# Optional: custom command to open picture files. {file} = resolved path.
# picture_command: "eog {file}"
